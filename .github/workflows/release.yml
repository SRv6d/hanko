---
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build release artifacts
        run: nix build .#release-artifacts --out-link release-artifacts --no-update-lock-file

      - name: Verify reproducibility of release artifacts
        run: nix build .#release-artifacts --rebuild --no-update-lock-file

      - name: Upload release artifacts
        run: gh release upload --clobber "${TAG}" release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Container Registry login
        if: runner.os == 'Linux'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract image metadata
        if: runner.os == 'Linux'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build container images
        if: runner.os == 'Linux'
        run: nix build .#release-containers --out-link release-containers --no-update-lock-file

      - name: Push container images
        if: runner.os == 'Linux'
        id: containers
        run: |
          : "${META_TAGS:?metadata action returned no tags}"
          mapfile -t meta_tags < <(printf '%s\n' "$META_TAGS")
          version_tag="${meta_tags[0]}"
          arch_tags=()
          for img in release-containers/*.tar.gz; do
            arch=$(basename "$img" .tar.gz)
            docker load < "$img"
            tag="${version_tag}-${arch}"
            docker tag "hanko:${version_tag##*:v}" "$tag"
            docker push "$tag"
            arch_tags+=("$tag")
          done
          tag_args=()
          for t in "${meta_tags[@]}"; do
            [[ -n "$t" ]] && tag_args+=(--tag "$t")
          done
          docker buildx imagetools create "${tag_args[@]}" "${arch_tags[@]}"
          digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' \
            "${version_tag}" | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "subject_name=${version_tag%%:*}" >> "$GITHUB_OUTPUT"
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Attest container image
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.containers.outputs.subject_name }}
          subject-digest: ${{ steps.containers.outputs.digest }}
          push-to-registry: true

  attest-build-provenance:
    permissions:
      id-token: write
      attestations: write
      contents: write
    needs: build
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_DIR: release-files
      PROVENANCE_PATH: release-files/hanko-${{ inputs.tag }}.sigstore.json
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Download release files
        run: >-
          gh release download "${TAG}" --dir "${DOWNLOAD_DIR}"
          --pattern "hanko-*"
          --pattern "SHA256SUMS"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest release files
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.DOWNLOAD_DIR }}/*

      - name: Prepare provenance bundle
        run: cp "${BUNDLE_PATH}" "${PROVENANCE_PATH}"
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}

      - name: Upload provenance
        run: gh release upload --clobber "${TAG}" "${PROVENANCE_PATH}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-publish:
    permissions:
      # Exchange GitHub's OIDC token for a short-lived crates.io publishing token.
      id-token: write
    needs: attest-build-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-release:
    permissions:
      # Change the draft release to a published release after every deliverable succeeds.
      contents: write
    needs: cargo-publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Publish release
        run: gh release edit "${TAG}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
